
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار نبرد اعداد صحیح</title>
<style>
*{box-sizing:border-box}
body{font-family:Tahoma,Arial;background:#eef2f7;margin:0;padding:18px;color:#172033}
.container{max-width:520px;margin:auto}
h1{text-align:center;color:#183b70;font-size:24px}
.panel{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 3px 12px #0001}
label{display:block;margin:12px 0 6px;font-weight:bold}
select,input,button{width:100%;padding:13px;border-radius:10px;border:1px solid #cbd5e1;font-size:17px}
button{background:#1956a5;color:white;border:0;margin-top:12px;font-weight:bold}
button:active{opacity:.8}
.question{font-size:24px;text-align:center;direction:ltr;padding:20px;background:#f1f5f9;border-radius:12px;margin-top:15px;min-height:75px}
.answer{font-size:24px;text-align:center;color:#08783b;font-weight:bold;margin-top:15px}
.small{text-align:center;color:#64748b;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h1>🎲 دستیار نبرد اعداد صحیح</h1>

<div class="panel">
<label>انتخاب سطح کارت</label>
<select id="level">
<option value="easy">آسان</option>
<option value="medium">متوسط</option>
<option value="hard">سخت</option>
</select>

<label>شماره کارت (۱ تا ۳۰)</label>
<input id="card" type="number" min="1" max="30" value="1">

<label>عدد تاس</label>
<input id="dice" type="number" min="1" max="6" value="1">

<button onclick="showCard()">نمایش سؤال</button>
</div>

<div class="panel">
<div class="small" id="cardTitle">سؤال کارت</div>
<div class="question" id="question">ابتدا کارت را انتخاب کن</div>
<button onclick="showAnswer()">نمایش پاسخ بازیکن</button>
<div class="answer" id="answer"></div>
</div>
</div>

<script>

["9 + (-4) + 24", "9+(-4)+24"],

["نیازمند تکمیل متن کارت", null],

["(-4) + 34 + (-7) × 6", "(-4)+34+(-7)*6"],
["نیازمند تکمیل متن کارت", null],

["نیازمند تکمیل متن کارت", null],
["نیازمند تکمیل متن کارت", null]
]
};

let current = null;
let modified = null;
let result = null;

function changeNumbers(expression, dice) {
  let tokens = [];
  let i = 0;
  let previous = "start";

  while (i < expression.length) {
    let c = expression[i];

    if (/\s/.test(c)) { i++; continue; }

    if (/[0-9.]/.test(c) || 
       ((c === "+" || c === "-") &&
        (previous === "start" || previous === "operator" || previous === "(") &&
        /[0-9.]/.test(expression[i+1] || ""))) {

      let start = i;
      if (c === "+" || c === "-") i++;
      while (i < expression.length && /[0-9.]/.test(expression[i])) i++;

      let value = Number(expression.slice(start, i));
      let change = tokens.filter(t => t.type === "number").length % 2 === 0 ? -dice : dice;
      tokens.push({type:"number", value:value + change});
      previous = "number";
      continue;
    }

    tokens.push({type:"symbol", value:c});
    if (c === "(") previous = "(";
    else if (c === ")") previous = ")";
    else if ("+-*/".includes(c)) previous = "operator";
    i++;
  }

  return tokens.map(t => t.value).join("");
}

function calculate(expression) {
  if (!expression || !/^[0-9+\-*/().\s]+$/.test(expression)) return null;
  try {
    return Function('"use strict"; return (' + expression + ')')();
  } catch(e) {
    return null;
  }
}

function showCard() {
  const level = document.getElementById("level").value;
  const number = Number(document.getElementById("card").value);
  const dice = Number(document.getElementById("dice").value);

  if (!Number.isInteger(number) || number < 1 || number > 30) {
    alert("شماره کارت باید بین ۱ تا ۳۰ باشد.");
    return;
  }
  if (!Number.isInteger(dice) || dice < 1 || dice > 6) {
    alert("عدد تاس باید بین ۱ تا ۶ باشد.");
    return;
  }

  current = cards[level][number - 1];
  modified = null;
  result = null;

  document.getElementById("cardTitle").textContent =
    "کارت شماره " + number;

  if (!current[1]) {
    document.getElementById("question").textContent = current[0];
    document.getElementById("answer").textContent =
      "این کارت هنوز آماده نشده است.";
    return;
  }

  modified = changeNumbers(current[1], dice);
  result = calculate(modified);

  document.getElementById("question").textContent =
    modified.replace(/\*/g, " × ").replace(/\//g, " ÷ ") + " = ؟";

  document.getElementById("answer").textContent = "";
}

function showAnswer() {
  if (!current) {
    alert("ابتدا یک کارت انتخاب کن.");
    return;
  }
  if (result === null || !Number.isFinite(result)) {
    document.getElementById("answer").textContent =
      "پاسخ این کارت نیازمند تکمیل است.";
    return;
  }
  document.getElementById("answer").textContent =
    "پاسخ: " + Number(result.toFixed(6));
}
</script>

</html>
